<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pro-Bending Manager</title>
  <style>
    :root { font-family: system-ui, Segoe UI, Roboto, Arial, sans-serif; }
    body { margin: 24px; line-height: 1.45; }
    .row{display:flex;gap:16px;flex-wrap:wrap}
    .card{border:1px solid #ddd;border-radius:8px;padding:12px;flex:1 1 320px}
    pre{white-space:pre-wrap;background:#fafafa;border-radius:6px;padding:10px;margin:0}
    button{padding:8px 12px;border:1px solid #444;border-radius:6px;background:#111;color:#fff;cursor:pointer}
    button:disabled{opacity:.5;cursor:default}
    canvas{width:100%;height:220px;border:1px solid #eee;border-radius:8px;background:#fff}
    .muted{color:#555}
    label{display:inline-flex;align-items:center;gap:6px;margin-right:10px}
    input{padding:4px 6px}
  </style>
</head>
<body>
  <h1>Pro-Bending Manager</h1>
  <p class="muted">3-minute rounds • summaries • MVP • between-round recovery</p>

  <div class="row">
    <div class="card" style="max-width:720px">
      <h2 style="margin:0 0 8px">Controls</h2>
      <div>
        <label>Seed <input id="seed" value="stormfront42" style="width:140px"></label>
        <label>Δt <input id="dt" type="number" min="1" max="10" step="1" value="5"></label>
        <span class="muted">Ticks = <b id="ticksAuto">—</b> (180/Δt)</span>
        <label>Scale <input id="scale" type="number" min="20" max="200" step="5" value="60"></label>
      </div>
      <div style="margin-top:8px">
        <label>Variance <input id="variance" type="range" min="0" max="100" value="30"></label>
        <label><input id="slow" type="checkbox" checked> Slow announcer</label>
        <label>Cadence (ms) <input id="cadence" type="number" min="50" max="2000" step="10" value="280" style="width:80px"></label>
      </div>
      <div style="margin-top:10px">
        <button id="runBtn" disabled>Run Round (<span id="roundNo">1</span>)</button>
        <button id="nextBtn" disabled>Next Round</button>
        <button id="resetBtn" disabled>Reset Match</button>
        <span id="boot" class="muted" style="margin-left:8px">Loading rosters…</span>
      </div>
    </div>

    <div class="card">
      <h2 style="margin:0 0 8px">Result</h2>
      <pre id="result">—</pre>
    </div>
  </div>

  <div class="row" style="margin-top:16px">
    <div class="card">
      <h2 style="margin:0 0 8px">Blue Team</h2>
      <pre id="blueRoster">—</pre>
    </div>
    <div class="card">
      <h2 style="margin:0 0 8px">Red Team</h2>
      <pre id="redRoster">—</pre>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <h2 style="margin:0 0 8px">Commentary</h2>
    <pre id="log">—</pre>
  </div>

  <div class="card" style="margin-top:16px">
    <h2 style="margin:0 0 8px">Timeline</h2>
    <canvas id="graph" width="900" height="220"></canvas>
  </div>

  <div class="card" style="margin-top:16px">
    <h2 style="margin:0 0 8px">Round Summary</h2>
    <pre id="summary">—</pre>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
